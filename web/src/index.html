<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>focusly ✿ study cutely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffb6d9;
    --pink-2:#ffd6ec;
    --lilac:#c8b6ff;
    --lilac-2:#e0d4ff;
    --mint:#b8f3d6;
    --cream:#fff4fb;
    --ink:#4a2d5e;
    --ink-soft:#7a5c8f;
    --line:#f0c8e2;
    --sun:#ffe27a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Fredoka', system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, #ffd6ec 0%, transparent 40%),
      radial-gradient(circle at 90% 20%, #c8b6ff 0%, transparent 45%),
      radial-gradient(circle at 20% 90%, #b8f3d6 0%, transparent 40%),
      radial-gradient(circle at 80% 85%, #ffe27a 0%, transparent 35%),
      linear-gradient(135deg,#fff4fb 0%,#ffe6f3 100%);
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:60px;
  }
  /* floating stickers */
  .sticker{position:fixed;font-size:28px;opacity:.55;pointer-events:none;user-select:none;animation:float 6s ease-in-out infinite}
  .s1{top:8%;left:6%;animation-delay:0s}
  .s2{top:15%;right:8%;font-size:34px;animation-delay:1s}
  .s3{bottom:12%;left:10%;font-size:32px;animation-delay:2s}
  .s4{bottom:20%;right:12%;font-size:26px;animation-delay:.5s}
  .s5{top:50%;left:3%;font-size:24px;animation-delay:1.5s}
  .s6{top:60%;right:4%;font-size:30px;animation-delay:2.5s}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-14px) rotate(4deg)}
  }

  .wrap{max-width:720px;margin:0 auto;padding:24px 20px 40px;position:relative;z-index:2}

  /* HEADER */
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .logo{
    font-family:'Caveat',cursive;font-weight:700;font-size:38px;
    background:linear-gradient(90deg,#ff7ab6,#a67aff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:flex;align-items:center;gap:6px;
  }
  .logo::before{content:"✿";font-family:'Fredoka';font-size:28px;-webkit-text-fill-color:#ff7ab6}
  .clock{
    background:#fff;border:2.5px solid var(--ink);border-radius:999px;
    padding:8px 16px;font-weight:600;font-size:15px;
    box-shadow:3px 3px 0 var(--ink);
  }

  /* TABS */
  .tabs{
    display:flex;gap:10px;background:#fff;
    border:2.5px solid var(--ink);border-radius:999px;
    padding:6px;box-shadow:4px 4px 0 var(--ink);
    margin:0 auto 28px;width:fit-content;
  }
  .tab{
    border:none;background:transparent;font-family:inherit;
    font-weight:600;font-size:15px;color:var(--ink-soft);
    padding:10px 22px;border-radius:999px;cursor:pointer;
    transition:all .2s;
  }
  .tab.active{
    background:linear-gradient(135deg,#ff9ecf,#c8a8ff);
    color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);
  }

  /* CARDS */
  .card{
    background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
    border:2.5px solid var(--ink);border-radius:28px;
    padding:26px;box-shadow:5px 5px 0 var(--ink);
    margin-bottom:22px;
  }

  /* TIMER */
  .timer-wrap{text-align:center}
  .presets{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .preset{
    border:2px solid var(--ink);background:#fff;
    padding:8px 16px;border-radius:999px;font-family:inherit;
    font-weight:600;font-size:14px;cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);transition:transform .15s;
  }
  .preset:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .preset.active{background:var(--sun)}

  .circle-wrap{position:relative;width:260px;height:260px;margin:10px auto 18px}
  .circle-svg{transform:rotate(-90deg);width:100%;height:100%}
  .circle-bg{fill:none;stroke:#ffd6ec;stroke-width:14}
  .circle-fg{fill:none;stroke:url(#grad);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .5s}
  .time-display{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;
  }
  .time-num{font-size:56px;font-weight:600;letter-spacing:-1px}
  .time-mode{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:2px;margin-top:2px}

  .controls{display:flex;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-weight:600;font-size:15px;
    border:2.5px solid var(--ink);padding:12px 26px;border-radius:999px;
    cursor:pointer;box-shadow:4px 4px 0 var(--ink);
    transition:transform .1s;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .btn-primary{background:linear-gradient(135deg,#ff9ecf,#c8a8ff);color:#fff}
  .btn-secondary{background:#fff;color:var(--ink)}
  .btn-mint{background:var(--mint);color:var(--ink)}

  .session-info{
    margin-top:18px;font-size:14px;color:var(--ink-soft);
    display:flex;justify-content:center;gap:16px;flex-wrap:wrap
  }
  .session-info b{color:var(--ink);font-weight:600}

  /* STUDY LIST */
  .add-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .input{
    flex:1;min-width:180px;
    font-family:inherit;font-size:15px;color:var(--ink);
    border:2.5px solid var(--ink);background:#fff;border-radius:999px;
    padding:12px 18px;outline:none;
    box-shadow:3px 3px 0 var(--ink);
  }
  .input::placeholder{color:#c9a8dc}
  .input:focus{background:#fff4fb}

  .subject{
    background:linear-gradient(135deg,#fff,#fff4fb);
    border:2.5px solid var(--ink);border-radius:22px;
    padding:18px 20px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink);
  }
  .subject-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;gap:10px;
  }
  .subject-title{
    font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .subject-title .dot{width:14px;height:14px;border-radius:50%;display:inline-block}
  .progress-mini{
    font-size:13px;color:var(--ink-soft);font-weight:500;
    background:var(--lilac-2);padding:4px 12px;border-radius:999px;
  }
  .del-btn{
    border:none;background:transparent;cursor:pointer;
    font-size:20px;opacity:.5;padding:4px;
  }
  .del-btn:hover{opacity:1}

  .task-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;background:#fff;border-radius:14px;
    margin-bottom:8px;border:2px solid #f0d4e8;
  }
  .task-row.done{opacity:.55}
  .task-row.done .task-text{text-decoration:line-through}
  .check{
    width:24px;height:24px;border:2.5px solid var(--ink);border-radius:8px;
    background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:14px;color:transparent;transition:all .15s;
  }
  .task-row.done .check{background:linear-gradient(135deg,#ff9ecf,#c8a8ff);color:#fff}
  .task-text{flex:1;font-size:15px}
  .task-add{display:flex;gap:8px;margin-top:10px}
  .task-add .input{padding:8px 14px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
  .task-add .btn{padding:8px 16px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}

  .empty{
    text-align:center;color:var(--ink-soft);padding:30px 10px;
    font-family:'Caveat',cursive;font-size:24px;
  }

  /* toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#fff;border:2.5px solid var(--ink);border-radius:999px;
    padding:12px 24px;font-weight:600;box-shadow:4px 4px 0 var(--ink);
    z-index:100;animation:pop .4s ease;
  }
  @keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translateX(-50%);opacity:1}}

  .hidden{display:none}

  /* mode pill */
  .mode-toggle{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
  .mode-pill{
    background:#fff;border:2px solid var(--ink);border-radius:999px;
    padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);font-family:inherit;
  }
  .mode-pill.active{background:var(--mint)}

  @media(max-width:520px){
    .time-num{font-size:44px}
    .circle-wrap{width:220px;height:220px}
    .logo{font-size:30px}
  }
</style>
</head>
<body>

<div class="sticker s1">✿</div>
<div class="sticker s2">⭐</div>
<div class="sticker s3">🎀</div>
<div class="sticker s4">✨</div>
<div class="sticker s5">☁️</div>
<div class="sticker s6">🌸</div>

<div class="wrap">
  <header>
    <div class="logo">focusly</div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="timer">⏱ timer</button>
    <button class="tab" data-tab="list">📚 study list</button>
  </div>

  <!-- TIMER VIEW -->
  <section id="view-timer" class="view">
    <div class="card timer-wrap">
      <div class="mode-toggle">
        <button class="mode-pill active" data-mode="focus">focus</button>
        <button class="mode-pill" data-mode="break">short break</button>
        <button class="mode-pill" data-mode="long">long break</button>
      </div>

      <div class="presets" id="presets"></div>

      <div class="circle-wrap">
        <svg class="circle-svg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff7ab6"/>
              <stop offset="100%" stop-color="#a67aff"/>
            </linearGradient>
          </defs>
          <circle class="circle-bg" cx="100" cy="100" r="88"/>
          <circle class="circle-fg" id="ring" cx="100" cy="100" r="88"
            stroke-dasharray="553" stroke-dashoffset="0"/>
        </svg>
        <div class="time-display">
          <div class="time-num" id="timeNum">25:00</div>
          <div class="time-mode" id="timeMode">focus time</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startBtn">start ✨</button>
        <button class="btn btn-secondary" id="resetBtn">reset</button>
      </div>

      <div class="session-info">
        <span>completed today: <b id="doneCount">0</b> 🌸</span>
        <span>total focus: <b id="totalMin">0</b> min</span>
      </div>
    </div>
  </section>

  <!-- STUDY LIST VIEW -->
  <section id="view-list" class="view hidden">
    <div class="card">
      <div class="add-row">
        <input class="input" id="subjectInput" placeholder="new subject… e.g. maths ✨" maxlength="40"/>
        <button class="btn btn-primary" id="addSubjectBtn">+ add</button>
      </div>
      <div id="subjects"></div>
      <div class="empty hidden" id="emptyState">nothing here yet — add a subject to get started ✿</div>
    </div>
  </section>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* ============ STATE ============ */
const STORE_KEY = 'focusly_lite_v1';
let state = {
  subjects: [],    // {id, name, color, tasks:[{id, text, done}]}
  stats: {}        // {yyyy-mm-dd: {sessions:n, minutes:n}}
};
try{ const s=localStorage.getItem(STORE_KEY); if(s) state=JSON.parse(s); }catch(e){}
const save=()=>localStorage.setItem(STORE_KEY,JSON.stringify(state));
const uid=()=>Math.random().toString(36).slice(2,10);
const todayKey=()=>new Date().toISOString().slice(0,10);
const colors=['#ffb6d9','#c8b6ff','#b8f3d6','#ffd88a','#ffa9c9','#a8e0ff','#f8b4d9'];

/* ============ TABS ============ */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const name=t.dataset.tab;
    document.getElementById('view-timer').classList.toggle('hidden',name!=='timer');
    document.getElementById('view-list').classList.toggle('hidden',name!=='list');
  };
});

/* ============ CLOCK ============ */
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tickClock(); setInterval(tickClock,1000);

/* ============ TIMER ============ */
const MODES={
  focus:{presets:[15,25,45],label:'focus time',default:25},
  break:{presets:[5,10,15],label:'short break',default:5},
  long:{presets:[15,20,30],label:'long break',default:20}
};
let mode='focus';
let duration=MODES.focus.default*60;
let remaining=duration;
let running=false;
let intervalId=null;
const CIRCUM=2*Math.PI*88;
document.getElementById('ring').setAttribute('stroke-dasharray',CIRCUM);

function fmt(s){
  const m=Math.floor(s/60), sec=s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function renderTimer(){
  document.getElementById('timeNum').textContent=fmt(remaining);
  document.getElementById('timeMode').textContent=MODES[mode].label;
  const offset=CIRCUM*(1-remaining/duration);
  document.getElementById('ring').setAttribute('stroke-dashoffset',offset);
}
function renderPresets(){
  const box=document.getElementById('presets');
  box.innerHTML='';
  MODES[mode].presets.forEach(m=>{
    const b=document.createElement('button');
    b.className='preset'+(m*60===duration?' active':'');
    b.textContent=m+' min';
    b.onclick=()=>{ if(running) return;
      duration=m*60; remaining=duration; renderPresets(); renderTimer();
    };
    box.appendChild(b);
  });
}
function setMode(m){
  if(running){ toast('pause first ✿'); return; }
  mode=m;
  document.querySelectorAll('.mode-pill').forEach(p=>{
    p.classList.toggle('active',p.dataset.mode===m);
  });
  duration=MODES[m].default*60;
  remaining=duration;
  renderPresets(); renderTimer();
}
document.querySelectorAll('.mode-pill').forEach(p=>{
  p.onclick=()=>setMode(p.dataset.mode);
});

function toggleTimer(){
  const btn=document.getElementById('startBtn');
  if(running){
    clearInterval(intervalId); running=false;
    btn.textContent='resume ✨'; btn.classList.remove('btn-mint'); btn.classList.add('btn-primary');
    return;
  }
  running=true;
  btn.textContent='pause'; btn.classList.remove('btn-primary'); btn.classList.add('btn-mint');
  intervalId=setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(intervalId); running=false;
      finishSession();
      return;
    }
    renderTimer();
  },1000);
}
function resetTimer(){
  clearInterval(intervalId); running=false;
  remaining=duration; renderTimer();
  const btn=document.getElementById('startBtn');
  btn.textContent='start ✨'; btn.classList.add('btn-primary'); btn.classList.remove('btn-mint');
}
function finishSession(){
  const btn=document.getElementById('startBtn');
  btn.textContent='start ✨'; btn.classList.add('btn-primary'); btn.classList.remove('btn-mint');
  if(mode==='focus'){
    const k=todayKey();
    if(!state.stats[k]) state.stats[k]={sessions:0,minutes:0};
    state.stats[k].sessions++;
    state.stats[k].minutes+=Math.round(duration/60);
    save(); renderStats();
    toast('yay! session done ✨ take a break 🎀');
    try{ playChime(); }catch(e){}
  }else{
    toast('break over ✿ back to focus!');
  }
  remaining=duration; renderTimer();
}
function playChime(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  [523,659,784].forEach((f,i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=f; o.type='sine';
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0,ctx.currentTime+i*0.15);
    g.gain.linearRampToValueAtTime(.2,ctx.currentTime+i*0.15+.02);
    g.gain.linearRampToValueAtTime(0,ctx.currentTime+i*0.15+.4);
    o.start(ctx.currentTime+i*0.15); o.stop(ctx.currentTime+i*0.15+.4);
  });
}
document.getElementById('startBtn').onclick=toggleTimer;
document.getElementById('resetBtn').onclick=resetTimer;

function renderStats(){
  const s=state.stats[todayKey()]||{sessions:0,minutes:0};
  document.getElementById('doneCount').textContent=s.sessions;
  document.getElementById('totalMin').textContent=s.minutes;
}

/* ============ STUDY LIST ============ */
function renderSubjects(){
  const box=document.getElementById('subjects');
  const empty=document.getElementById('emptyState');
  box.innerHTML='';
  if(!state.subjects.length){ empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  state.subjects.forEach(sub=>{
    const done=sub.tasks.filter(t=>t.done).length;
    const total=sub.tasks.length;
    const el=document.createElement('div');
    el.className='subject';
    el.innerHTML=`
      <div class="subject-head">
        <div class="subject-title"><span class="dot" style="background:${sub.color}"></span>${escapeHtml(sub.name)}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="progress-mini">${done}/${total}</span>
          <button class="del-btn" data-del="${sub.id}" title="remove">✕</button>
        </div>
      </div>
      <div class="tasks"></div>
      <div class="task-add">
        <input class="input task-input" placeholder="add a task…" data-sub="${sub.id}" maxlength="80"/>
        <button class="btn btn-secondary" data-addtask="${sub.id}">+</button>
      </div>
    `;
    const tbox=el.querySelector('.tasks');
    sub.tasks.forEach(t=>{
      const row=document.createElement('div');
      row.className='task-row'+(t.done?' done':'');
      row.innerHTML=`
        <div class="check" data-toggle="${sub.id}|${t.id}">✓</div>
        <div class="task-text">${escapeHtml(t.text)}</div>
        <button class="del-btn" data-deltask="${sub.id}|${t.id}">✕</button>
      `;
      tbox.appendChild(row);
    });
    box.appendChild(el);
  });
  bindListEvents();
}
function bindListEvents(){
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    state.subjects=state.subjects.filter(s=>s.id!==b.dataset.del);
    save(); renderSubjects();
  });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const [sid,tid]=b.dataset.toggle.split('|');
    const s=state.subjects.find(x=>x.id===sid);
    const t=s.tasks.find(x=>x.id===tid);
    t.done=!t.done; save(); renderSubjects();
  });
  document.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=()=>{
    const [sid,tid]=b.dataset.deltask.split('|');
    const s=state.subjects.find(x=>x.id===sid);
    s.tasks=s.tasks.filter(x=>x.id!==tid);
    save(); renderSubjects();
  });
  document.querySelectorAll('[data-addtask]').forEach(b=>b.onclick=()=>{
    const sid=b.dataset.addtask;
    const input=document.querySelector(`.task-input[data-sub="${sid}"]`);
    const v=input.value.trim(); if(!v) return;
    const s=state.subjects.find(x=>x.id===sid);
    s.tasks.push({id:uid(),text:v,done:false});
    save(); renderSubjects();
  });
  document.querySelectorAll('.task-input').forEach(inp=>{
    inp.onkeydown=e=>{
      if(e.key==='Enter'){
        const sid=inp.dataset.sub;
        document.querySelector(`[data-addtask="${sid}"]`).click();
      }
    };
  });
}
document.getElementById('addSubjectBtn').onclick=()=>{
  const inp=document.getElementById('subjectInput');
  const v=inp.value.trim(); if(!v) return;
  state.subjects.push({
    id:uid(), name:v,
    color:colors[state.subjects.length % colors.length],
    tasks:[]
  });
  inp.value=''; save(); renderSubjects();
};
document.getElementById('subjectInput').onkeydown=e=>{
  if(e.key==='Enter') document.getElementById('addSubjectBtn').click();
};

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ============ TOAST ============ */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add('hidden'),2600);
}

/* ============ INIT ============ */
renderPresets(); renderTimer(); renderStats(); renderSubjects();
</script>
</body>
</html>
